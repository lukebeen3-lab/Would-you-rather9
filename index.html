<style>
:root{
  --bg-0:#06070d; --bg-1:#0b0e1a; --bg-2:#12162a;
  --violet:#7c6cff; --violet-2:#a78bfa; --cyan:#5ee7d0; --rose:#ff6f9c; --amber:#ffb454;
  --ink:#f3f4fb; --ink-dim:#9aa0c0; --ink-faint:#5c6188;
  --glass:rgba(255,255,255,0.055); --glass-brd:rgba(255,255,255,0.11);
  --radius-lg:28px; --radius-md:20px; --radius-sm:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --anim-speed:1;
  --fs-scale:1;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg-0:#eef0fb; --bg-1:#e6e9fa; --bg-2:#dde1f7;
  --ink:#161826; --ink-dim:#4a4e6f; --ink-faint:#7c81a6;
  --glass:rgba(20,20,40,0.045); --glass-brd:rgba(20,20,40,0.10);
  color-scheme: light;
}
:root[data-contrast="high"]{ --glass-brd:rgba(255,255,255,0.35); --ink-dim:#e4e6f7; }
:root[data-theme="light"][data-contrast="high"]{ --glass-brd:rgba(20,20,40,0.4); --ink-dim:#2a2c42; }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; overscroll-behavior:none; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  background:var(--bg-0); color:var(--ink);
  overflow:hidden; position:fixed; inset:0;
  font-size:calc(16px * var(--fs-scale));
  transition:background .5s ease,color .4s ease;
}
#app{ position:fixed; inset:0; padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  padding-left:var(--safe-l); padding-right:var(--safe-r); }

/* ---------- animated backdrop ---------- */
.backdrop{ position:fixed; inset:0; z-index:0; overflow:hidden; background:
  radial-gradient(ellipse 120% 80% at 20% -10%, rgba(124,108,255,0.28), transparent 60%),
  radial-gradient(ellipse 100% 70% at 90% 10%, rgba(94,231,208,0.14), transparent 55%),
  radial-gradient(ellipse 100% 90% at 50% 120%, rgba(255,111,156,0.16), transparent 60%),
  var(--bg-0);
  transition:background .5s ease;
}
.orb{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.55; will-change:transform;
  animation:drift calc(26s / var(--anim-speed)) ease-in-out infinite; }
.orb.o1{ width:46vmax; height:46vmax; left:-18vmax; top:-16vmax; background:radial-gradient(circle,rgba(124,108,255,.55),transparent 70%); animation-duration:calc(30s / var(--anim-speed)); }
.orb.o2{ width:38vmax; height:38vmax; right:-14vmax; top:6vmax; background:radial-gradient(circle,rgba(94,231,208,.4),transparent 70%); animation-duration:calc(24s / var(--anim-speed)); animation-delay:-6s; }
.orb.o3{ width:42vmax; height:42vmax; left:8vmax; bottom:-20vmax; background:radial-gradient(circle,rgba(255,111,156,.38),transparent 70%); animation-duration:calc(34s / var(--anim-speed)); animation-delay:-12s; }
@keyframes drift{ 0%,100%{ transform:translate(0,0) scale(1);} 33%{ transform:translate(4%,3%) scale(1.06);} 66%{ transform:translate(-3%,4%) scale(0.97);} }
.particles{ position:absolute; inset:0; }
.particle{ position:absolute; border-radius:50%; background:rgba(255,255,255,.5); opacity:0;
  animation:rise linear infinite; }
@keyframes rise{ 0%{ transform:translateY(0) translateX(0); opacity:0;} 8%{opacity:.6;} 92%{opacity:.4;} 100%{ transform:translateY(-115vh) translateX(var(--drift,20px)); opacity:0;} }
:root[data-motion="reduced"] .orb, :root[data-motion="reduced"] .particle{ animation:none !important; }

/* ---------- layout ---------- */
.screen{ position:absolute; inset:0; z-index:1; display:flex; flex-direction:column;
  padding:max(20px,var(--safe-t)) 0 0; overflow:hidden; }
.scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 22px 40px; }
.center-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }

/* ---------- glass card ---------- */
.glass{ background:var(--glass); border:1px solid var(--glass-brd); border-radius:var(--radius-md);
  backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 8px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06); }

/* ---------- typography ---------- */
.eyebrow{ font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--violet-2); font-weight:700; }
h1,h2,h3{ margin:0; font-weight:800; letter-spacing:-0.02em; }

<script>
'use strict';

/* =========================================================
   STORAGE. Uses Claude artifact storage when present,
   falls back to localStorage for standalone deployment.
========================================================= */
const Store = {
  async get(key, fallback=null){
    try{
      if (window.storage && typeof window.storage.get === 'function'){
        const r = await window.storage.get(key);
        return r ? JSON.parse(r.value) : fallback;
      }
    }catch(e){}
    try{ const v = localStorage.getItem(key); return v!==null ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
  },
  async set(key, value){
    try{
      if (window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(key, JSON.stringify(value)); return;
      }
    }catch(e){}
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }
};

/* =========================================================
   FIREBASE CONFIG. Fill in FIREBASE_DB_URL with your own
   Realtime Database URL to get live cross-device sync once
   this file is hosted outside Claude.ai (e.g. GitHub Pages).
   Leave it blank and the app still works inside the Claude
   preview (via window.storage), or falls back further to
   same-device pass-and-play if neither is available.

   Where to get this value: Firebase console > your project >
   Build > Realtime Database. The URL is shown at the top of
   that page, looks like:
   "https://YOUR-PROJECT-ID-default-rtdb.firebaseio.com"
========================================================= */
const FIREBASE_DB_URL = "https://wouldyourather-c7aa1-default-rtdb.firebaseio.com"; // <-- paste your Realtime Database URL here

/* =========================================================
   SHARED STORE. Cross-device party sync. Prefers Firebase
   Realtime Database (works on any static host, including
   GitHub Pages) when FIREBASE_DB_URL is set. Otherwise uses
   the shared (non-personal) slot of window.storage, which
   only exists inside the Claude.ai artifact preview. Falls
   back gracefully to same-device pass-and-play when neither
   is available.

   The whole room (host info, player list, round state, and
   this round's answers) lives in ONE storage key/path. Earlier
   versions split a room across a key per player and a key
   per answer, which meant every poll fired a burst of
   separate network calls, and that's what made joins flaky
   under load. One key means one read and one write per
   update, so joins land the first time and every device
   stays in sync.

   All Firebase reads/writes are scoped under the "rooms" node
   so the database security rules can be locked to just that
   path (see setup notes provided alongside this file).
========================================================= */
const SharedStore = {
  available(){
    return !!FIREBASE_DB_URL || !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
  },
  async get(key){
    if (FIREBASE_DB_URL){
      try{
        const res = await fetch(`${FIREBASE_DB_URL}/rooms/${encodeURIComponent(key)}.json`, { keepalive: true });
        if (!res.ok) return null;
        return await res.json();
      }catch(e){ return null; }
    }
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    if (FIREBASE_DB_URL){
      try{
        const res = await fetch(`${FIREBASE_DB_URL}/rooms/${encodeURIComponent(key)}.json`, {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(value),
          keepalive: true
        });
        return res.ok;
      }catch(e){ return false; }
    }
    try{ await window.storage.set(key, JSON.stringify(value), true); return true; }catch(e){ return false; }
  }
};
function roomKey(code){ return 'wyr:room:'+code; }
function genPid(){ return Math.random().toString(36).slice(2,10); }
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

async function getRoom(code){ return await SharedStore.get(roomKey(code)); }

/* Read modify write with a couple of retries. Storage here is
   last write wins, so two people acting at almost the same
   moment (two joins, or a join and a host action) can in rare
   cases overwrite each other. Retrying the merge, and having
   pollParty re-add a player who goes missing, keeps the room
   correct without needing a real server. */
async function updateRoom(code, mutate, attempts=3){
  let result = null;
  for (let i=0; i<attempts; i++){
    const current = await getRoom(code);
    const next = mutate(current);
    if (next === null) return current;
    next.updatedAt = Date.now();
    const ok = await SharedStore.set(roomKey(code), next);
    if (ok){ result = next; break; }
    await sleep(120*(i+1));
  }
  return result;
}
async function createRoom(hostPid, hostName){
  let code = genRoomCode();
  for (let i=0; i<5; i++){
    const existing = await getRoom(code);
    if (!existing) break;
    code = genRoomCode();
  }
  const room = {
    code, hostPid, status:'lobby', deck:[], qIndex:0, showResults:false,
    players:[{pid:hostPid, name:hostName, host:true, joinedAt:Date.now(), lastSeen:Date.now()}],
    answers:{}, createdAt:Date.now(), updatedAt:Date.now()
  };
  const ok = await SharedStore.set(roomKey(code), room);
  return ok ? room : null;
}
/* Joining is the one write two people are most likely to make at
   the exact same moment (two friends tapping Join within the same
   second). updateRoom's own retries only fire when a write fails
   outright, not when two writes both succeed but the second one
   overwrites the first's player list. So after writing, this
   confirms the player actually landed in the room and, if a race
   quietly dropped them, tries again. */
async function joinRoom(code, pid, name, attempts=4){
  for (let i=0; i<attempts; i++){
    const wrote = await updateRoom(code, current=>{
      if (!current) return null;
      const players = (current.players||[]).slice();
      if (!players.some(p=>p.pid===pid) && players.length<MAX_PLAYERS) players.push({pid, name, host:false, joinedAt:Date.now(), lastSeen:Date.now()});
      return {...current, players};
    });
    if (!wrote) return null;
    // updateRoom returns the object it just wrote, but a second
    // writer could have landed a moment later and overwritten it.
    // Re-read what's actually persisted before trusting it.
    await sleep(60 + Math.random()*90);
    const persisted = await getRoom(code);
    if (persisted && persisted.players.some(p=>p.pid===pid)) return persisted;
  }
  return await getRoom(code);
}

function build(){
  const out=[];
  const push=(cat,arr)=>arr.forEach(([a,b])=>out.push(Q(cat,a,b)));
  push('deep', RAW_DEEP);
  push('deep', RAW_DEEP_2);
  push('mindbend', RAW_MIND);
  push('mindbend', RAW_MIND_2);
  push('classic', RAW_CLASSIC);
  push('classic', RAW_CLASSIC_2);
  push('funny', RAW_FUNNY);
  push('funny', RAW_FUNNY_2);
  push('impossible', RAW_IMPOSSIBLE);
  push('impossible', RAW_IMPOSSIBLE_2);
  push('life', RAW_LIFE);
  push('life', RAW_LIFE_2);
  push('friends', RAW_FRIENDS);
  push('friends', RAW_FRIENDS_2);
  push('family', RAW_FAMILY);
  push('family', RAW_FAMILY_2);
  push('random', RAW_RANDOM);
  push('random', RAW_RANDOM_2);
  push('adventure', RAW_ADVENTURE);
  push('adventure', RAW_ADVENTURE_2);
  // remove exact duplicate question pairs while preserving first occurrence
  const seen = new Set();
  const deduped = out.filter(q=>{
    const key = q.cat+'|'+q.a.trim().toLowerCase()+'|'+q.b.trim().toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
  out.length = 0; out.push(...deduped);
  out.forEach((q,i)=>{ q.id = q.cat+'_'+i; });
  return out;
}

function haptic(ms=10){
  if (state.haptic && navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} }
}
function playTone(freq=440, dur=0.08, type='sine', vol=0.05){
  if (!state.sound) return;
  try{
    const ctx = playTone._ctx || (playTone._ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value = vol * (state.musicVolume/100);
    o.connect(g); g.connect(ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = 'var(--glass)'; el.style.border='1px solid var(--glass-brd)'; el.style.color='var(--ink)';
  el.style.backdropFilter='blur(20px)';
  el.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* Tells the shared room right away that this device is leaving,
   instead of waiting up to STALE_MS for the heartbeat to go quiet.
   Fire-and-forget on purpose: it's called both from in-app back
   buttons (where we're about to navigate away anyway) and from the
   page-unload handler below (where there's no time to await anything). */
function leavePartyRoom(){
  if (!state.party.code || !state.party.online || !state.party.myId) return;
  const code = state.party.code, pid = state.party.myId;
  updateRoom(code, current=>{
    if (!current) return null;
    const players = (current.players||[]).filter(p=>p.pid!==pid);
    return {...current, players};
  });
}
window.addEventListener('pagehide', leavePartyRoom);

function partyReset(){
  stopPartyPolling();
  const wins = state.party.wins || 0;
  state.party = { code:null, players:[], mode:null, qIndex:0, answers:{}, deck:[], showResults:false, timer:8, timerId:null, timeLeft:8, online:false, isHost:false, myId:null, control:null, wins, connectionIssue:false };
  clearActiveSession();
}

  partyPollTimer = setInterval(pollParty, 1500);
  pollParty();
  startHeartbeat();
}
function stopPartyPolling(){
  if (partyPollTimer){ clearInterval(partyPollTimer); partyPollTimer=null; }
  stopHeartbeat();
}
function startHeartbeat(){
  if (heartbeatTimer) return;
  heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_MS);
}
function stopHeartbeat(){
  if (heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer=null; }
}
/* Checking in this often (rather than only on taps) is what lets an
   idle player - tab open, just not answering - stay in the room. Only
   a device whose tab actually closed or lost its connection stops
   checking in, which is what the staleness cleanup in pollParty below
   uses to tell "idle" apart from "gone". */
async function sendHeartbeat(){
  if (!state.party.code || !state.party.online || !state.party.myId) return;
  await updateRoom(state.party.code, current=>{
    if (!current) return null;
    const players = (current.players||[]).map(p=> p.pid===state.party.myId ? {...p, lastSeen:Date.now()} : p);
    return {...current, players};
  });
}
async function pollParty(){
  if (!state.party.code || !state.party.online) return;
  const code = state.party.code;
  const room = await getRoom(code);
  if (!room){
    // Could be a dropped request or the room really is gone. Only
    // treat it as gone after several misses in a row so a blip in
    // the connection never boots someone out of a live game.
    pollFailStreak++;
    if (pollFailStreak>=5 && state.party.everSeenRoom){
      state.party.control = {...(state.party.control||{}), status:'finished'};
      if (['host','lobby','partyPlay'].includes(state.screen)) render();
    } else if (pollFailStreak>=3){
      state.party.connectionIssue = true;
      if (['host','lobby','partyPlay'].includes(state.screen)) render();
    }
    return;
  }
  pollFailStreak = 0;
  state.party.everSeenRoom = true;
  const hadConnectionIssue = state.party.connectionIssue;
  state.party.connectionIssue = false;

  let players = (room.players||[]).slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));

  // Drop players whose heartbeat has gone stale - their tab actually
  // closed or lost its connection, as opposed to just sitting idle
  // (an idle tab keeps sending heartbeats, so it's never touched here).
  const now = Date.now();
  const wasStale = p => p.pid!==state.party.myId && (now-(p.lastSeen||p.joinedAt||0))>STALE_MS;
  if (players.some(wasStale)){
    const countBefore = players.length;
    const cleaned = await updateRoom(code, current=>{
      if (!current) return null;
      const remaining = (current.players||[]).filter(p=> p.pid===state.party.myId || (Date.now()-(p.lastSeen||p.joinedAt||0))<=STALE_MS);
      if (remaining.length === (current.players||[]).length) return null;
      return {...current, players:remaining};
    });
    if (cleaned){
      room.players = cleaned.players; room.updatedAt = cleaned.updatedAt;
      players = (cleaned.players||[]).slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
      const stillHere = players.some(p=>p.pid===state.party.myId);
      if (countBefore>1 && players.length<=1 && stillHere){
        stopPartyPolling();
        partyReset();
        toast('Everyone else left the room');
        go('menu');
        return;
      }
    }
  }

  // Only rebuild the whole screen when something structural changed
  // (new question, results just revealed, room status changed). A
  // full render() recreates every element, which restarts the
  // continuous CSS animations on the question card and choice
  // buttons - doing that on every poll tick, including ones that
  // only carry someone else's answer, is what made the buttons look
  // like they kept replaying their animation. Player/answer-only
  // changes get patched in place instead (see patchPartyPlayLive).
  const structSnap = (qIndex, showResults, status)=> qIndex+'|'+!!showResults+'|'+status;
  const structuralChanged = structSnap(state.party.qIndex, state.party.showResults, state.party.control && state.party.control.status)
    !== structSnap(room.qIndex, room.showResults, room.status);
  const listSnap = (p, answers)=> JSON.stringify({ players:(p||[]).map(x=>x.pid+'|'+x.name+'|'+!!x.host), answers:answers||{} });
  const lightChanged = listSnap(state.party.players, state.party.answers) !== listSnap(players, room.answers);

  state.party.players = players;
  state.party.control = room;
  state.party.deck = room.deck || state.party.deck;
  state.party.qIndex = room.qIndex;
  state.party.showResults = room.showResults;
  state.party.answers = room.answers || {};

  // Self heal: if a write race dropped us from the player list,
  // rejoin quietly instead of leaving the player stranded.
  if (state.party.myId && !players.some(p=>p.pid===state.party.myId) && room.status!=='finished'){
    joinRoom(code, state.party.myId, state.name||'Player');
  }

  if (state.party.isHost && room.status==='playing' && !room.showResults){
    const answered = Object.keys(room.answers||{}).length;
    const roundExpired = room.roundStartedAt && (Date.now()-room.roundStartedAt > ROUND_TIMEOUT_MS);
    if ((players.length>0 && answered >= players.length) || roundExpired){
      await hostRevealResults();
      return;
    }
  }
  if (state.screen==='lobby' && room.status==='playing'){ go('partyPlay'); return; }
  const needsFullRender = hadConnectionIssue || structuralChanged;
  if (needsFullRender && ['host','lobby','partyPlay'].includes(state.screen)){
    render();
  } else if (lightChanged && state.screen==='partyPlay'){
    if (!patchPartyPlayLive()) render();
  } else if (lightChanged && ['host','lobby'].includes(state.screen)){
    render();
  }
}

function go(screen){ state.screen = screen; if (!['host','lobby','partyPlay'].includes(screen)) stopPartyPolling(); render(); }

/* ---- reconnect after a refresh: remember the active room in
   personal (non-shared) storage so this device can quietly
   rejoin instead of losing its spot ---- */
function saveActiveSession(){
  const p = state.party;
  if (!p.code || !p.online) return;
  Store.set('wyr_active_room', {code:p.code, myId:p.myId, isHost:p.isHost, name:state.name});
}
function clearActiveSession(){ Store.set('wyr_active_room', null); }
async function tryResumeSession(){
  const saved = await Store.get('wyr_active_room', null);
  if (!saved || !saved.code || !SharedStore.available()) return false;
  const room = await getRoom(saved.code);
  if (!room || room.status==='finished'){ clearActiveSession(); return false; }
  state.party.code = saved.code;
  state.party.myId = saved.myId;
  state.party.isHost = saved.isHost;
  state.party.online = true;
  state.party.control = room;
  state.party.players = room.players||[];
  state.party.deck = room.deck||[];
  state.party.qIndex = room.qIndex||0;
  state.party.showResults = !!room.showResults;
  state.party.answers = room.answers||{};
  state.party.everSeenRoom = true;
  startPartyPolling();
  state.screen = room.status==='playing' ? 'partyPlay' : (saved.isHost ? 'host' : 'lobby');
  return true;
}

/* =========================================================
   QUESTION QUEUE LOGIC (no repeat until exhausted)
========================================================= */
function shuffled(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function getQueue(cat){
  const key='wyrSeen_'+cat;
  const pool = (cat==='all'?QUESTIONS:QUESTIONS.filter(q=>q.cat===cat)).map(q=>q.id);
  let seen=[];
  try{seen=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
  seen=seen.filter(id=>pool.includes(id));
  if(seen.length>=pool.length){seen=[];localStorage.removeItem(key);}
  let remaining=pool.filter(id=>!seen.includes(id));
  if(!state.session.queueByCat[cat]||state.session.queueByCat[cat].length===0){
    state.session.queueByCat[cat]=shuffled(remaining);
  }
  return state.session.queueByCat[cat];
}
function nextQuestion(cat){
  const q = getQueue(cat);
  const id = q.shift();
  const key='wyrSeen_'+cat;let s=[];try{s=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){} if(!s.includes(id)){s.push(id);localStorage.setItem(key,JSON.stringify(s));}
  return QUESTIONS.find(x=>x.id===id);
}

function recordAnswer(question, pick){
  state.stats.totalAnswered++;
  state.stats.byCategory[question.cat] = (state.stats.byCategory[question.cat]||0)+1;
  state.stats.recent.unshift({id:question.id, cat:question.cat, a:question.a, b:question.b, pick, t:Date.now()});
  state.stats.recent = state.stats.recent.slice(0,25);
  saveProfile();
}

function topCategory(){
  const entries = Object.entries(state.stats.byCategory);
  if (!entries.length) return null;
  entries.sort((a,b)=>b[1]-a[1]);
  return entries[0][0];
}

/* =========================================================
   PARTY MODE. Live cross-device rooms.
   Each room lives in a single shared storage document keyed
   by its room code, holding the host, the player list, the
   round, and the current round's answers together. Every
   device polls that one document, so a room created on one
   phone can be joined from any other phone, tablet, or
   computer with the same code, votes update for everyone,
   and only the host advances the round.
   Falls back to local same-device pass-and-play automatically
   if the shared storage backend isn't available.
========================================================= */
function genRoomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function renderHost(){
  const s = el('div','screen center-col');
  if (!state.party.code){
    const pid = genPid();
    const name = (state.name||'Host').trim() || 'Host';
    const online = SharedStore.available();
    state.party.myId = pid;
    state.party.isHost = true;
    state.party.online = online;
    state.party.mode = 'setup';
    if (online){
      state.party.code = '······';
      createRoom(pid, name).then(room=>{
        if (!room){ state.party.online=false; state.party.code=genRoomCode(); state.party.players=[{pid,name,host:true,joinedAt:Date.now()}]; render(); return; }
        state.party.code = room.code;
        state.party.control = room;
        state.party.players = room.players;
        state.party.everSeenRoom = true;
        saveActiveSession();
        startPartyPolling();
        render();
      });
    } else {
      state.party.code = genRoomCode();
      state.party.players = [{pid, name, host:true, joinedAt:Date.now()}];
    }
  }
  const online = state.party.online;
  const offlineNotice = online ? '' : `<div class="glass fade-in" style="margin-top:22px;padding:16px 18px;max-width:420px;text-align:left"><div class="row-sub" style="line-height:1.6">This device cannot reach the live game service right now, so friends cannot join over the network. Play pass and play instead: add everyone below and take turns on this device.</div></div>`;
  const connectionNotice = (online && state.party.connectionIssue) ? `<div class="glass fade-in" style="margin-top:18px;padding:14px 18px;max-width:420px;text-align:left"><div class="row-sub">Having trouble reaching the room. Still trying…</div></div>` : '';
  s.innerHTML = `
    <div class="topbar" style="position:absolute;top:max(20px,var(--safe-t));left:0;right:0"><div class="icon-btn" id="back">←</div><div></div><div style="width:44px"></div></div>
    <div class="eyebrow">Party Mode ${online?'· Live':'· Same Device'}</div>
    <h2 style="margin-top:8px">Room Code</h2>
    <div class="room-code glass glow-text" id="codeBox">${state.party.code}</div>
    <button class="btn ghost" id="copyBtn">📋 Copy Code</button>
    ${offlineNotice}${connectionNotice}
    <div style="width:100%;max-width:420px;margin-top:24px" id="playerList"></div>
    <p class="row-sub" style="margin-top:10px;text-align:center">${online ? 'Send this code to friends. It works from any device.' : 'Add a player below for each person passing the device around.'}</p>
    ${online ? '' : `
    <div class="field" style="margin-top:14px">
      <input id="addPlayerInput" class="text-input" placeholder="Player name" maxlength="16" />
    </div>
    <button class="btn ghost block" id="addPlayerBtn" style="max-width:420px;margin-top:10px">Add Player</button>`}
    <button class="btn primary block" id="startPartyBtn" style="max-width:420px;margin-top:18px">Start Game</button>
  `;
  appEl.appendChild(s);
  s.querySelector('#back').addEventListener('click', ()=>{ leavePartyRoom(); partyReset(); go('menu'); });
  s.querySelector('#copyBtn').addEventListener('click', ()=>{
    navigator.clipboard && navigator.clipboard.writeText(state.party.code).catch(()=>{});
    toast('Room code copied'); haptic();
  });
  function renderPlayers(){
    const list = s.querySelector('#playerList'); list.innerHTML='';
    state.party.players.forEach((p,i)=>{
      const chip = el('div','player-chip glass');
      chip.innerHTML = `<div class="avatar">${p.name[0].toUpperCase()}</div><div style="flex:1;text-align:left;font-weight:700">${escapeHtml(p.name)}${p.host?' <span style="color:var(--violet-2);font-size:11px">HOST</span>':''}</div>`;
      if (!p.host && !online){
        const rm = el('div','icon-btn', '✕'); rm.style.width='32px'; rm.style.height='32px'; rm.style.fontSize='13px';
        rm.addEventListener('click', ()=>{ state.party.players.splice(i,1); renderPlayers(); });
        chip.appendChild(rm);
      }
      list.appendChild(chip);
    });
  }
  renderPlayers();
  if (!online){
    const addInput = s.querySelector('#addPlayerInput');
    s.querySelector('#addPlayerBtn').addEventListener('click', ()=>{
      const n = addInput.value.trim(); if(!n) return;
      if (state.party.players.length>=MAX_PLAYERS){ toast('Party is full (8 players max)'); return; }
      if (state.party.players.some(p=>p.name.toLowerCase()===n.toLowerCase())){ toast('Someone already has that name'); return; }
      state.party.players.push({name:n, host:false, pid:genPid()}); addInput.value=''; renderPlayers(); haptic(6);
    });
  }
  s.querySelector('#startPartyBtn').addEventListener('click', async ()=>{
    if (state.party.players.length<2){ toast('Add at least one more player first'); return; }
    const deck = shuffled(QUESTIONS).map(q=>q.id);
    state.party.deck = deck; state.party.qIndex=0; state.party.answers={}; state.party.showResults=false;
    if (online){
      const room = await updateRoom(state.party.code, current=>{
        if (!current) return null;
        return {...current, status:'playing', deck, qIndex:0, showResults:false, answers:{}, roundStartedAt:Date.now()};
      });
      if (!room){ toast('Could not start the game. Check your connection and try again.'); return; }
      state.party.control = room;
    }
    go('partyPlay');
  });
}
function renderJoin(){
  const s = el('div','screen center-col');
  const needName = !state.name;
  s.innerHTML = `
    <div class="topbar" style="position:absolute;top:max(20px,var(--safe-t));left:0;right:0"><div class="icon-btn" id="back">←</div><div></div><div style="width:44px"></div></div>
    <div class="eyebrow">Join Game</div>
    <h2 style="margin-top:8px">Enter the Room Code</h2>
    <div class="field" style="margin-top:20px"><input id="codeInput" class="text-input code" maxlength="6" placeholder="••••••" autocomplete="off" autocapitalize="characters" /></div>
    ${needName ? `<div class="field" style="margin-top:14px"><input id="nameInput" class="text-input" placeholder="Your name" maxlength="18" /></div>` : ''}
    <p id="joinErr" style="color:var(--rose);margin-top:12px;font-size:13px;min-height:18px"></p>
    <button class="btn primary block" id="joinBtn" style="max-width:380px;margin-top:20px">Join Room</button>
  `;
  appEl.appendChild(s);
  s.querySelector('#back').addEventListener('click', ()=>go('menu'));
  const input = s.querySelector('#codeInput');
  input.addEventListener('input', ()=>{ input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') s.querySelector('#joinBtn').click(); });
  const nameInput = s.querySelector('#nameInput');
  const errEl = s.querySelector('#joinErr');
  const joinBtn = s.querySelector('#joinBtn');
  joinBtn.addEventListener('click', async ()=>{
    const code = input.value.trim();
    if (code.length!==6){ errEl.textContent='Room codes are six letters and numbers.'; haptic(20); return; }
    if (!SharedStore.available()){ errEl.textContent='This device cannot reach the live game service, so it cannot join over the network.'; haptic(20); return; }
    const name = (needName ? nameInput.value.trim() : state.name).trim();
    if (!name){ errEl.textContent='Enter your name.'; haptic(20); return; }
    joinBtn.disabled = true;
    errEl.textContent='Looking for the room…';
    let room = await getRoom(code);
    if (!room){ errEl.textContent="We couldn't find a room with that code. Check it with the host and try again."; haptic(20); joinBtn.disabled=false; return; }
    if (room.status==='finished'){ errEl.textContent='That game already ended. Ask the host to start a new one.'; joinBtn.disabled=false; return; }
    if ((room.players||[]).length>=MAX_PLAYERS){ errEl.textContent='This room is full (8 players max).'; haptic(20); joinBtn.disabled=false; return; }
    if (needName){ state.name = name; saveProfile(); }
    const pid = genPid();
    room = await joinRoom(code, pid, name);
    if (!room || !(room.players||[]).some(p=>p.pid===pid)){
      errEl.textContent='The room did not respond. Try again in a moment.'; haptic(20); joinBtn.disabled=false; return;
    }
    state.party.code = code;
    state.party.myId = pid;
    state.party.isHost = false;
    state.party.online = true;
    state.party.control = room;
    state.party.players = room.players;
    state.party.deck = room.deck||[];
    state.party.qIndex = room.qIndex||0;
    state.party.showResults = !!room.showResults;
    state.party.answers = room.answers||{};
    state.party.everSeenRoom = true;
    errEl.textContent='';
    haptic(); playTone(560,0.08,'sine',0.05);
    saveActiveSession();
    startPartyPolling();
    go(room.status==='playing' ? 'partyPlay' : 'lobby');
  });
}

function renderPartyPlay(){
  const p = state.party;
  if (!p.online){ renderPartyPlayOffline(); return; }
  const s = el('div','screen');
  const deck = p.deck||[];
  const finished = (p.control && p.control.status==='finished') || p.qIndex >= deck.length;
  if (finished){
    s.innerHTML = `<div class="center-col"><div class="splash-logo" style="font-size:50px">🏁</div><h2 class="glow-text" style="margin-top:14px">Game Complete</h2><p style="margin-top:8px">Great round, everyone!</p>
      <button class="btn primary" id="doneBtn" style="margin-top:24px">Back to Menu</button></div>`;
    appEl.appendChild(s);
    s.querySelector('#doneBtn').addEventListener('click', async ()=>{
      if (p.isHost && p.code && p.control && p.control.status!=='finished'){
        await updateRoom(p.code, current=> current ? {...current, status:'finished'} : null);
      }
      leavePartyRoom(); partyReset(); go('menu');
    });
    return;
  }
  const q = QUESTIONS.find(x=>x.id===deck[p.qIndex]);
  if (!q){ s.innerHTML = `<div class="center-col"><p class="row-sub">Loading…</p></div>`; appEl.appendChild(s); return; }
  const myAnswer = p.answers[p.myId];
  const answeredCount = Object.keys(p.answers).length;
  const totalPlayers = p.players.length;

  s.innerHTML = `
    <div class="topbar">
      <div class="icon-btn" id="back">←</div>
      <h2 id="roundHeader" style="font-size:14px;color:var(--ink-dim)">Round ${p.qIndex+1} · ${answeredCount}/${totalPlayers} answered</h2>
      <div style="width:44px"></div>
    </div>
    <div class="q-progress"><div class="q-progress-fill" style="width:${(p.qIndex/deck.length)*100}%"></div></div>
    <div class="qwrap" id="partyStage"></div>`;
  appEl.appendChild(s);
  s.querySelector('#back').addEventListener('click', ()=>{ leavePartyRoom(); partyReset(); go('menu'); });

  const stage = s.querySelector('#partyStage');
  if (!p.showResults){
    stage.innerHTML = `
      <div class="q-stage">
        <div class="q-text q-enter"><span class="wyr">Would You Rather</span>${escapeHtml(capitalize(q.a))}<br/>or ${escapeHtml(q.b)}?</div>
        <div class="choices">
          <div class="choice-btn glass left q-enter${myAnswer==='a'?' picked':''}${myAnswer==='b'?' faded':''}" id="pA"><span class="choice-label">Option A</span><span class="choice-text">${escapeHtml(capitalize(q.a))}</span></div>
          <div class="choice-btn glass right b q-enter${myAnswer==='b'?' picked':''}${myAnswer==='a'?' faded':''}" id="pB"><span class="choice-label">Option B</span><span class="choice-text">${escapeHtml(capitalize(q.b))}</span></div>
        </div>
        ${myAnswer ? '<p class="row-sub" style="margin-top:14px">Waiting for everyone else to answer…</p>' : ''}
      </div>`;
    if (!myAnswer){
      stage.querySelector('#pA').addEventListener('click', ()=>partyPickOnline('a'));
      stage.querySelector('#pB').addEventListener('click', ()=>partyPickOnline('b'));
    }
    if (p.isHost && answeredCount>0){
      const revealBtn = el('button','btn ghost block','Reveal Results Now');
      revealBtn.id = 'liveRevealBtn';
      revealBtn.style.maxWidth='420px'; revealBtn.style.margin='16px auto 0'; revealBtn.style.display='block';
      revealBtn.addEventListener('click', ()=>hostRevealResults());
      stage.appendChild(revealBtn);
    }
  } else {
    const total = totalPlayers;
    const aVoters = p.players.filter(pl=>p.answers[pl.pid]==='a').map(pl=>pl.name);
    const bVoters = p.players.filter(pl=>p.answers[pl.pid]==='b').map(pl=>pl.name);
    const aPct = total ? Math.round((aVoters.length/total)*100) : 0, bPct = 100-aPct;
    stage.innerHTML = `
      <div class="q-stage">
        <div class="q-text q-enter" style="font-size:clamp(18px,4.6vw,24px)"><span class="wyr">Results</span>${escapeHtml(capitalize(q.a))} <span style="color:var(--ink-faint)">or</span> ${escapeHtml(q.b)}?</div>
        <div class="result-row q-enter">
          <div class="result-bar">
            <div class="result-bar-fill" id="fillA" style="width:0%"></div>
            <div class="result-bar-content"><span>Option A · ${aVoters.length} vote${aVoters.length===1?'':'s'}</span><span class="result-pct">${aPct}%</span></div>
            <div class="result-names">${aVoters.map(n=>`<span class="pill">${escapeHtml(n)}</span>`).join('')}</div>
          </div>
          <div class="result-bar">
            <div class="result-bar-fill" id="fillB" style="width:0%"></div>
            <div class="result-bar-content"><span>Option B · ${bVoters.length} vote${bVoters.length===1?'':'s'}</span><span class="result-pct">${bPct}%</span></div>
            <div class="result-names">${bVoters.map(n=>`<span class="pill">${escapeHtml(n)}</span>`).join('')}</div>
          </div>
        </div>
        ${p.isHost ? '<button class="btn primary block" id="nextRoundBtn" style="max-width:420px;margin:18px auto 0">Next Round</button>' : '<p class="row-sub" style="margin-top:14px">Waiting for the host to continue…</p>'}
      </div>`;
    requestAnimationFrame(()=>{
      const fa = stage.querySelector('#fillA'), fb = stage.querySelector('#fillB');
      if (fa) fa.style.width = aPct+'%'; if (fb) fb.style.width = bPct+'%';
    });
    if (p.isHost){
      stage.querySelector('#nextRoundBtn').addEventListener('click', ()=>hostNextRound());
    }
  }
}
/* Updates only the "answered count" text (and the reveal button /
   waiting message) in place, without touching the question card or
   choice buttons. Those elements carry continuous CSS animations
   (q-enter, the floating choice-btn bob) that restart from scratch
   any time they're recreated - rebuilding the whole stage every time
   someone else answers is what made the buttons look like they kept
   replaying their animation. Returns false if a full render() is
   needed instead (question changed, results just revealed, etc.). */
function patchPartyPlayLive(){
  const p = state.party;
  if (state.screen!=='partyPlay' || !p.online || p.showResults) return false;
  const deck = p.deck||[];
  if ((p.control && p.control.status==='finished') || p.qIndex>=deck.length) return false;
  const header = appEl.querySelector('#roundHeader');
  const stage = appEl.querySelector('#partyStage .q-stage');
  if (!header || !stage) return false;
  const answeredCount = Object.keys(p.answers).length;
  const totalPlayers = p.players.length;
  header.textContent = `Round ${p.qIndex+1} · ${answeredCount}/${totalPlayers} answered`;
  const myAnswer = p.answers[p.myId];
  if (myAnswer && !stage.querySelector('.row-sub')){
    const msg = el('p','row-sub','Waiting for everyone else to answer…');
    msg.style.marginTop='14px';
    stage.appendChild(msg);
  }
  if (p.isHost && answeredCount>0 && !stage.querySelector('#liveRevealBtn')){
    const revealBtn = el('button','btn ghost block','Reveal Results Now');
    revealBtn.id = 'liveRevealBtn';
    revealBtn.style.maxWidth='420px'; revealBtn.style.margin='16px auto 0'; revealBtn.style.display='block';
    revealBtn.addEventListener('click', ()=>hostRevealResults());
    stage.appendChild(revealBtn);
  }
  return true;
}
async function partyPickOnline(side){
  haptic(14); playTone(side==='a'?520:640,0.1,'triangle',0.06);
  state.party.answers[state.party.myId] = side;
  render();
  const room = await updateRoom(state.party.code, current=>{
    if (!current) return null;
    const answers = {...(current.answers||{})};
    answers[state.party.myId] = side;
    return {...current, answers};
  });
  if (room){ state.party.control = room; }
}
async function hostRevealResults(){
  if (!state.party.isHost || !state.party.code) return;
  const room = await updateRoom(state.party.code, current=> current ? {...current, showResults:true} : null);
  if (room){ state.party.control = room; state.party.showResults = true; render(); }
}
async function hostNextRound(){
  if (!state.party.isHost || !state.party.code) return;
  const nextIndex = state.party.qIndex+1;
  const room = await updateRoom(state.party.code, current=>{
    if (!current) return null;
    const status = nextIndex >= (current.deck||[]).length ? 'finished' : 'playing';
    return {...current, qIndex:nextIndex, showResults:false, status, answers:{}, roundStartedAt:Date.now()};
  });
  if (room){
    state.party.control = room; state.party.qIndex = nextIndex; state.party.showResults = false; state.party.answers = {};
    render();
  }
}

/* ---- offline fallback: same-device pass-and-play ---- */
function renderPartyPlayOffline(){
  const s = el('div','screen');
  const p = state.party;
  if (p.qIndex >= p.deck.length){
    s.innerHTML = `<div class="center-col"><div class="splash-logo" style="font-size:50px">🏁</div><h2 class="glow-text" style="margin-top:14px">Game Complete</h2><p style="margin-top:8px">Great round, everyone!</p>
      <button class="btn primary" id="doneBtn" style="margin-top:24px">Back to Menu</button></div>`;
    appEl.appendChild(s);
    s.querySelector('#doneBtn').addEventListener('click', ()=>{ leavePartyRoom(); partyReset(); go('menu'); });
    return;
  }
  const q = QUESTIONS.find(x=>x.id===p.deck[p.qIndex]);
  const answeredCount = Object.keys(p.answers).length;

  s.innerHTML = `
    <div class="topbar">
      <div class="icon-btn" id="back">←</div>
      <h2 style="font-size:14px;color:var(--ink-dim)">Round ${p.qIndex+1} · ${answeredCount}/${p.players.length} answered</h2>
      <div style="width:44px"></div>
    </div>
    <div class="q-progress"><div class="q-progress-fill" style="width:${((p.qIndex)/p.deck.length)*100}%"></div></div>
    <div class="qwrap" id="partyStage"></div>`;
  appEl.appendChild(s);
  s.querySelector('#back').addEventListener('click', ()=>{ leavePartyRoom(); partyReset(); go('menu'); });

  const stage = s.querySelector('#partyStage');
  if (!p.showResults){
    const currentPlayer = p.players[answeredCount];
    stage.innerHTML = `
      <div class="q-stage">
        <div class="eyebrow">Pass the device to</div>
        <h2 class="glow-text" style="font-size:24px">${escapeHtml(currentPlayer.name)}</h2>
        <div class="q-text q-enter"><span class="wyr">Would You Rather</span>${escapeHtml(capitalize(q.a))}<br/>or ${escapeHtml(q.b)}?</div>
        <div class="choices">
          <div class="choice-btn glass left q-enter" id="pA"><span class="choice-label">Option A</span><span class="choice-text">${escapeHtml(capitalize(q.a))}</span></div>
          <div class="choice-btn glass right b q-enter" id="pB"><span class="choice-label">Option B</span><span class="choice-text">${escapeHtml(capitalize(q.b))}</span></div>
        </div>
      </div>`;
    stage.querySelector('#pA').addEventListener('click', ()=>partyPickOffline(currentPlayer.name,'a'));
    stage.querySelector('#pB').addEventListener('click', ()=>partyPickOffline(currentPlayer.name,'b'));
  } else {
    const total = p.players.length;
    const aVoters = Object.entries(p.answers).filter(([,v])=>v==='a').map(([k])=>k);
    const bVoters = Object.entries(p.answers).filter(([,v])=>v==='b').map(([k])=>k);
    const aPct = Math.round((aVoters.length/total)*100), bPct = 100-aPct;
    stage.innerHTML = `
      <div class="q-stage">
        <div class="q-text q-enter" style="font-size:clamp(18px,4.6vw,24px)"><span class="wyr">Results</span>${escapeHtml(capitalize(q.a))} <span style="color:var(--ink-faint)">or</span> ${escapeHtml(q.b)}?</div>
        <div class="result-row q-enter">
          <div class="result-bar">
            <div class="result-bar-fill" id="fillA" style="width:0%"></div>
            <div class="result-bar-content"><span>Option A · ${aVoters.length} vote${aVoters.length===1?'':'s'}</span><span class="result-pct">${aPct}%</span></div>
            <div class="result-names">${aVoters.map(n=>`<span class="pill">${escapeHtml(n)}</span>`).join('')}</div>
          </div>
          <div class="result-bar">
            <div class="result-bar-fill" id="fillB" style="width:0%"></div>
            <div class="result-bar-content"><span>Option B · ${bVoters.length} vote${bVoters.length===1?'':'s'}</span><span class="result-pct">${bPct}%</span></div>
            <div class="result-names">${bVoters.map(n=>`<span class="pill">${escapeHtml(n)}</span>`).join('')}</div>
          </div>
        </div>
        <p style="margin-top:6px" id="nextIn">Next round in 4s…</p>
      </div>`;
    requestAnimationFrame(()=>{
      const fa = stage.querySelector('#fillA'), fb = stage.querySelector('#fillB');
      if (fa) fa.style.width = aPct+'%'; if (fb) fb.style.width = bPct+'%';
    });
    let left = 4;
    const timerEl = stage.querySelector('#nextIn');
    const iv = setInterval(()=>{
      left--; if(timerEl) timerEl.textContent = `Next round in ${Math.max(left,0)}s…`;
      if (left<=0){ clearInterval(iv); p.showResults=false; p.answers={}; p.qIndex++; render(); }
    }, 1000);
  }
}
function partyPickOffline(name, side){
  haptic(14); playTone(side==='a'?520:640,0.1,'triangle',0.06);
  state.party.answers[name]=side;
  if (Object.keys(state.party.answers).length >= state.party.players.length){
    state.party.showResults = true;
  }
  render();
}

/* =========================================================
   UTIL
========================================================= */
function capitalize(str){ return str.charAt(0).toUpperCase()+str.slice(1); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* particles */
function spawnParticles(){
  const wrap = document.getElementById('particles');
  wrap.innerHTML='';
  const n = 22;
  for(let i=0;i<n;i++){
    const p = document.createElement('div'); p.className='particle';
    const size = 2+Math.random()*3;
    p.style.width=size+'px'; p.style.height=size+'px';
    p.style.left = (Math.random()*100)+'%';
    p.style.bottom = '-5%';
    p.style.setProperty('--drift', (Math.random()*60-30)+'px');
    p.style.animationDuration = (14+Math.random()*14)+'s';
    p.style.animationDelay = (Math.random()*18)+'s';
    wrap.appendChild(p);
  }
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  await loadState();
  applyTheme();
  spawnParticles();
  await tryResumeSession();
  render();
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if(state.theme==='system') applyTheme(); });
})();
</script>
</body>
